[project]
name = "unipdf"
version = "0.1.0"
description = "Hindi and Marathi text from PDFs as Unicode, with word boxes and font attributes"
readme = "README.md"
authors = [
    { name = "mukundesh", email = "mukundesh@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    # pinned: glyph join and box behaviour were measured on this version (SPIKES.md)
    "pymupdf==1.28.2",
    "ply>=3.11",
    "fonttools>=4.50",
]

[project.scripts]
unipdf = "unipdf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = [
    "gate: Devanagari converter regression, part of the release gate",
    "smoke: other-script converter regression, shipped unchanged (D-9)",
]

[tool.ruff]
line-length = 100
# the absorbed indic2unicode code is kept as upstream wrote it (D-16)
extend-exclude = ["src/unipdf/i2u", "spikes"]
